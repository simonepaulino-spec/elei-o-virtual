
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urna Eletrônica GET Paraguai</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Ubuntu', sans-serif;
            background-color: #e5e7eb;
            background-image: radial-gradient(#d1d5db 1px, transparent 1px);
            background-size: 20px 20px; /* Subtle baseplate pattern */
        }
        
        .lego-brick {
            position: relative;
            border-radius: 8px;
            box-shadow: 
                inset 2px 2px 0 rgba(255,255,255,0.2),
                inset -2px -2px 0 rgba(0,0,0,0.1),
                0 4px 0 rgba(0,0,0,0.2);
            transition: all 0.1s ease;
        }
        
        .lego-brick:active {
            transform: translateY(2px);
            box-shadow: 
                inset 2px 2px 0 rgba(255,255,255,0.2),
                inset -2px -2px 0 rgba(0,0,0,0.1),
                0 2px 0 rgba(0,0,0,0.2);
        }

        /* The circular connectors on top of LEGO bricks */
        .lego-studs {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(24px, 1fr));
            grid-gap: 12px;
            padding: 8px;
            opacity: 0.15;
        }

        .stud {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: currentColor;
            box-shadow: inset 1px 1px 2px rgba(255,255,255,0.4), 1px 1px 2px rgba(0,0,0,0.2);
        }

        .lego-border {
            border: 4px solid #1a1a1a;
            box-shadow: 8px 8px 0px 0px #1a1a1a;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.4s ease-out forwards;
        }
    </style>
<script type="importmap">
{

    "recharts": "https://esm.sh/recharts@^3.7.0"

}
</script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
